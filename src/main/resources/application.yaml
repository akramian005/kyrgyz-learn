server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: kyrgyz-learn

  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:5432/${POSTGRES_DB:kyrgyz-learn}
    #    url: jdbc:postgresql://postgres:5433/${POSTGRES_DB:kyrgyz_learn} #подключение к бд в докер где хост 5433 но бд 5432
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  # по умолчанию Spring пропускает файлы только до 1MB — поднимаем до лимита видео в FileStorageService
  # (лимиты картинок и аудио меньше, их проверяет сам FileStorageService)
  servlet:
    multipart:
      max-file-size: 500MB
      max-request-size: 501MB

  web:
    error:
      include-message: always #при запуске спринг через docker нужно включить
      include-stacktrace: always

security:
  jwt:
    secret: ${JWT_SECRET:8s6tn0h9s4WWLopNHv9Gi2HqHCSKiOxOvCCkPL6O5GQ=}
    #    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
    expiration-ms: ${JWT_EXPIRATION_MS:31536000000}

logging:
  level:
    org.springframework.security: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.schema: DEBUG

# Картинки, аудио и видео официальных курсов лежат в этой папке на сервере (не в MinIO и не в jar);
# пути image/audio/video в content/official/*.json — относительно неё. Относительный путь считается
# от папки, из которой запущен бэкенд (kyrgyz-learn/), в Docker — от /app
official-content:
  media-dir: ${OFFICIAL_MEDIA_DIR:./official-media}

# Тестовые пользователи *@test.kg с курсами для проверки поиска и пагинации (DevDataSeeder).
# Создаются один раз при старте; на проде выключить: DEV_DATA_ENABLED=false
dev-data:
  enabled: ${DEV_DATA_ENABLED:true}

minio:
  url: http://${MINIO_HOST:localhost}:${MINIO_API_PORT:9000}
  public-url: http://${MINIO_PUBLIC_HOST:localhost}:${MINIO_API_PORT:9000}
  access-key: ${MINIO_ROOT_USER:minioadmin}
  secret-key: ${MINIO_ROOT_PASSWORD:minioadmin}
  bucket: ${MINIO_BUCKET:kyrgyzlearn-media}